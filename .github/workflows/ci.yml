name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:package
      - run: pnpm run size
