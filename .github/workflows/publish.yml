name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24' # Specify your target Node.js version
          cache: 'pnpm'

      - name: Install npm@latest
        run: npm install -g npm@latest

      - name: Check npm version
        run: npm --version

      - name: Validate release version
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint project
        run: pnpm run lint

      - name: Test project
        run: pnpm test

      - name: Build project
        run: pnpm run build

      - name: Test package outputs
        run: pnpm run test:package

      - name: Check package size
        run: pnpm run size

      - name: Inspect package
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --provenance